# Production nginx config for the static bundle in /usr/share/nginx/html.
# Keep the CSP in sync with vite.config.ts, public/_headers and vercel.json.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide version, block dotfiles.
    server_tokens off;
    location ~ /\. { deny all; }

    # WebAssembly needs the right MIME type for streaming compilation.
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: https://huggingface.co https://*.hf.co; worker-src 'self' blob:; child-src 'self' blob:; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Enable once the site is served over HTTPS by the proxy in front of this container.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Prerendered pages live at /<route>/index.html; serve them without a trailing-slash redirect,
    # then fall back to the SPA shell. Never cache HTML.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
