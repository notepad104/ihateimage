name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write # OIDC token to assume the AWS role; no stored AWS keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: with one, GitHub's OIDC subject becomes
    # repo:<owner>/<repo>:environment:<name>, which must also be trusted by the role.
    # deploy/aws/github-oidc.yaml now trusts both forms, so add
    # `environment: production` back after redeploying that stack if you want approvals.
    steps:
      - name: Check configuration
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is not set. Deploy deploy/aws/github-oidc.yaml and store its RoleArn output (see README, 'Continuous deployment from GitHub')."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build, update stack, upload, invalidate
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ALT_DOMAIN: ${{ vars.ALT_DOMAIN }}
          CERT_ARN: ${{ vars.CERT_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          AWS_REGION: us-east-1
        run: bash deploy/aws/deploy.sh

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          if [ -n "$DOMAIN" ]; then
            URL="https://$DOMAIN"
          else
            URL=$(aws cloudformation describe-stacks --stack-name ihateimage --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          fi
          echo "Checking $URL"
          curl -fsSIL "$URL/compress" | grep -i "content-security-policy" >/dev/null
          curl -fsSL "$URL/sitemap.xml" | grep -q "<loc>"
