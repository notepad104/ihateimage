name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify CSP is present in the built HTML
        run: grep -q "Content-Security-Policy" dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
